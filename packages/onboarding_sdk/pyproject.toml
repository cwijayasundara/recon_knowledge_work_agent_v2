[project]
name = "onboarding-sdk"
version = "0.1.0"
description = "Deterministic onboarding core: reading, profiling, recipes, entity rules, rendering"
requires-python = ">=3.12"
dependencies = [
    "python-calamine>=0.3",
    "openpyxl>=3.1",
    "polars>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onboarding_sdk"]
